[project]
name = "lander"
version = "0.1.0"
description = "Lander is a simple game where the player controls a spaceship and tries to land it safely on a platform. Reinforcement learning is explored in this project to train an agent to play the game effectively."
requires-python = ">=3.14"
dependencies = [
    "matplotlib>=3.10.8",
    "numpy>=2.4.2",
    "pygame-ce>=2.5.6",
    "tqdm>=4.67.3",
]
